<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>恐龍復活牧場 3D</title>
<style>
:root{
  --paper:#f6f1e7; --ink:#2b2620; --muted:#8a8070; --line:#e2d9c6; --card:#fffdf8;
  --gold:#c9a227;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;max-width:1000px;margin:0 auto;padding:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
@media (max-width:640px){body{padding:6px}h1{font-size:17px}.sub{font-size:11px}.help{font-size:11.5px}}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:8px}
h1{font-size:20px;letter-spacing:2px}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.stats{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d878,var(--gold));border:1px solid #a8842a;display:inline-block}
#wrap{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;border:2px solid var(--ink);box-shadow:0 4px 0 rgba(43,38,32,.15);touch-action:none}
canvas{display:block;width:100%;background:#a9cb85}
#joyBase{position:absolute;left:22px;bottom:22px;width:118px;height:118px;border-radius:50%;background:rgba(43,38,32,.18);border:2px solid rgba(255,253,248,.55);display:none;pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,253,248,.85);border:2px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(43,38,32,.3)}
#actBtn{position:absolute;right:20px;bottom:30px;width:84px;height:84px;border-radius:50%;border:2.5px solid var(--ink);background:radial-gradient(circle at 35% 30%,#e8c95a,#c9a227);color:#4a3a08;font-size:15px;font-weight:700;font-family:inherit;display:none;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 0 #a8842a;line-height:1.25;cursor:pointer;white-space:pre-line}
#actBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8842a}
#actBtn.feed{background:radial-gradient(circle at 35% 30%,#9cc47e,#4a7c59);color:#fff;box-shadow:0 4px 0 #35573d}
#hint{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);background:rgba(43,38,32,.85);color:#f6f1e7;font-size:13px;padding:6px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--ink);font-size:13px;padding:7px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:5}
#loadtip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#a9cb85;color:#4d6b35;font-size:14px}
.help{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.9}
.help b{color:var(--ink)}
kbd{background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:11px;font-family:inherit}
#shop{position:fixed;inset:0;background:rgba(43,38,32,.45);display:none;align-items:center;justify-content:center;z-index:10}
#shop.open{display:flex}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:18px;width:min(560px,92vw);max-height:84vh;overflow:auto;padding:20px}
.panel h2{font-size:17px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.panel h2 button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px}
.it .thumb{height:72px;display:flex;align-items:center;justify-content:center}
.it canvas{width:auto;height:72px}
.it .nm{font-size:14px;font-weight:600}
.it .mt{font-size:11.5px;color:var(--muted);line-height:1.55}
.it button{margin-top:5px;padding:7px 10px;border-radius:9px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-size:13px;cursor:pointer}
.it button:disabled{opacity:.35;cursor:default}
.ghost{margin-top:12px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <h1>🦕 恐龍復活牧場 3D</h1>
    <div class="sub">手繪恐龍 · 自由視角版</div>
  </div>
  <div class="stats">
    <span class="chip"><span class="coin"></span><span id="coinTxt">0</span></span>
    <span class="chip">🦖 <span id="dinoTxt">0</span> 隻</span>
  </div>
</header>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="loadtip">正在繪製恐龍…（需連網載入 Three.js）</div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="actBtn"></button>
  <div id="hint"></div>
  <div id="toast"></div>
</div>

<div class="help" id="helpTxt">
  <b>手機：</b>左半螢幕按住出搖桿走路 · <b>右半螢幕滑動旋轉視角</b> · 站到店門地墊點「🛒 商店」· 靠近恐龍點「🍖 餵食」<br>
  <b>電腦：</b><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 走路 · 按住滑鼠拖曳旋轉視角 · 滾輪縮放 · <kbd>E</kbd> 開店 · <kbd>F</kbd> 餵食
</div>

<div id="shop">
  <div class="panel">
    <h2>🛖 恐龍商店 <button onclick="closeShop()" title="關閉">✕</button></h2>
    <div class="items" id="itemGrid"></div>
    <button class="ghost" onclick="resetGame()">重新開始（清除存檔）</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

/* ================= 基本 ================= */
const cv = document.getElementById("cv");
const wrapEl = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f0);
scene.fog = new THREE.Fog(0xbfe3f0, 70, 160);
const camera = new THREE.PerspectiveCamera(55, 1.6, 0.1, 400);

scene.add(new THREE.HemisphereLight(0xffffff, 0x87a86a, 1.0));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(40, 60, 25);
scene.add(sun);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const M = (c) => new THREE.MeshLambertMaterial({ color: c });
function box(w, h, d, c, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c));
  m.position.set(x, y, z); return m;
}
function cyl(rt, rb, h, c, x = 0, y = 0, z = 0, seg = 10) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), M(c));
  m.position.set(x, y, z); return m;
}
function shadowBlob(r) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 20),
    new THREE.MeshBasicMaterial({ color: 0x2b2620, transparent: true, opacity: 0.18 }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.02; return m;
}

/* ================= 世界 ================= */
const WORLD_R = 95;
const PEN = { x: -46, z: -26, w: 86, h: 62 };
const SHOP_POS = new THREE.Vector3(48, 0, -38);
const MAT = { x: SHOP_POS.x - 5, z: SHOP_POS.z + 12.5, w: 10, h: 7 };

{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), M(0xa9cb85));
  g.rotation.x = -Math.PI / 2; scene.add(g);
  const penG = new THREE.Mesh(new THREE.PlaneGeometry(PEN.w, PEN.h), M(0xb5d493));
  penG.rotation.x = -Math.PI / 2;
  penG.position.set(PEN.x + PEN.w / 2, 0.01, PEN.z + PEN.h / 2);
  scene.add(penG);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(6, 60), M(0xd8c9a3));
  path.rotation.x = -Math.PI / 2; path.position.set(SHOP_POS.x - 2, 0.015, SHOP_POS.z + 40);
  scene.add(path);
  const path2 = new THREE.Mesh(new THREE.PlaneGeometry(50, 6), M(0xd8c9a3));
  path2.rotation.x = -Math.PI / 2; path2.position.set(10, 0.015, PEN.z - 4);
  scene.add(path2);
}
{
  const s = new THREE.Group();
  s.add(box(16, 7, 11, 0xe8d9b8, 0, 3.5, 0));
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 12.5, 5, 4), M(0xb3543f));
  roof.position.y = 9.5; roof.rotation.y = Math.PI / 4; s.add(roof);
  s.add(box(3.4, 5, 0.4, 0x8a6b42, 3.5, 2.5, 5.6));
  s.add(box(4, 2.6, 0.3, 0xbfe0ee, -4, 4.2, 5.55));
  s.add(box(7, 1.6, 0.4, 0xfffdf8, 0, 6.4, 5.7));
  s.position.copy(SHOP_POS); scene.add(s);
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(MAT.w, MAT.h), M(0xd8b93a));
  mat.rotation.x = -Math.PI / 2;
  mat.position.set(MAT.x + MAT.w / 2, 0.03, MAT.z + MAT.h / 2);
  scene.add(mat);
}
{
  const fence = new THREE.Group();
  const postG = new THREE.BoxGeometry(0.35, 1.6, 0.35);
  const postM = M(0x8a6b42);
  const addPost = (x, z) => { const p = new THREE.Mesh(postG, postM); p.position.set(x, 0.8, z); fence.add(p); };
  const rail = (x1, z1, x2, z2) => {
    const len = Math.hypot(x2 - x1, z2 - z1);
    const r = new THREE.Mesh(new THREE.BoxGeometry(len, 0.18, 0.18), postM);
    r.position.set((x1 + x2) / 2, 1.15, (z1 + z2) / 2);
    r.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
    fence.add(r);
    const r2 = r.clone(); r2.position.y = 0.55; fence.add(r2);
  };
  const gap = { x: 10, w: 9 };
  let px = PEN.x;
  while (px <= PEN.x + PEN.w) { if (!(px > gap.x && px < gap.x + gap.w)) addPost(px, PEN.z); px += 4; }
  for (let z = PEN.z; z <= PEN.z + PEN.h; z += 4) { addPost(PEN.x, z); addPost(PEN.x + PEN.w, z); }
  px = PEN.x;
  while (px <= PEN.x + PEN.w) { addPost(px, PEN.z + PEN.h); px += 4; }
  rail(PEN.x, PEN.z, gap.x, PEN.z); rail(gap.x + gap.w, PEN.z, PEN.x + PEN.w, PEN.z);
  rail(PEN.x, PEN.z, PEN.x, PEN.z + PEN.h);
  rail(PEN.x + PEN.w, PEN.z, PEN.x + PEN.w, PEN.z + PEN.h);
  rail(PEN.x, PEN.z + PEN.h, PEN.x + PEN.w, PEN.z + PEN.h);
  scene.add(fence);
}
{
  const treeAt = (x, z) => {
    const t = new THREE.Group();
    t.add(cyl(0.35, 0.45, 2.2, 0x8a6b42, 0, 1.1, 0, 7));
    const c = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4.5, 7), M(0x5c7a44));
    c.position.y = 4.4; t.add(c);
    const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.2, 7), M(0x6b8a4f));
    c2.position.y = 6.2; t.add(c2);
    t.position.set(x, 0, z); scene.add(t);
  };
  for (let i = 0; i < 16; i++) {
    const a = rand(0, Math.PI * 2), r = rand(70, 100);
    treeAt(Math.cos(a) * r, Math.sin(a) * r);
  }
  for (let i = 0; i < 8; i++) {
    const s = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.5, 1.2)), M(0x9a958a));
    const a = rand(0, Math.PI * 2), r = rand(60, 95);
    s.position.set(Math.cos(a) * r, 0.4, Math.sin(a) * r);
    scene.add(s);
  }
}

/* ============================================================
   手繪風恐龍畫家 — 用 canvas 畫出擬真手繪插畫
   每種恐龍 3 個走路影格（pose 0 站立 / 1 / 2 邁步）
   全部面向右邊，移動時向左會鏡像
   ============================================================ */
const PAINT = {
  trike:  { h: 3.4, aspect: 1.55, body: "#7c9a4e", dark: "#5e7a3a", belly: "#c9d8a3", name: "三角龍" },
  stego:  { h: 3.2, aspect: 1.60, body: "#c47a3d", dark: "#9d5f2a", belly: "#ecd0a8", name: "劍龍" },
  brachio:{ h: 6.8, aspect: 1.00, body: "#5f83ad", dark: "#4a678a", belly: "#c2d4e8", name: "腕龍" },
  trex:   { h: 4.6, aspect: 1.30, body: "#b0483a", dark: "#8a362b", belly: "#e8b8a8", name: "暴龍" },
};
const GOLD_PAINT = { body: "#d9b93b", dark: "#a8842a", belly: "#f7ecc0" };
const INK = "rgba(48,38,26,.92)";

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h; return c;
}
/* 手繪筆觸紋理：在 path 範圍內畫深淺短筆觸 */
function brushTexture(c, path, bbox, dark, light, n = 70) {
  c.save();
  c.clip(path);
  for (let i = 0; i < n; i++) {
    const x = rand(bbox[0], bbox[0] + bbox[2]), y = rand(bbox[1], bbox[1] + bbox[3]);
    const a = rand(0, Math.PI * 2), l = rand(6, 18);
    c.strokeStyle = Math.random() < 0.55 ? dark : light;
    c.globalAlpha = rand(0.05, 0.13);
    c.lineWidth = rand(1.5, 3.5);
    c.beginPath();
    c.moveTo(x, y);
    c.quadraticCurveTo(x + Math.cos(a) * l * 0.5, y + Math.sin(a) * l * 0.5 - 2,
                       x + Math.cos(a) * l, y + Math.sin(a) * l);
    c.stroke();
  }
  c.restore();
  c.globalAlpha = 1;
}
function grad(c, x0, y0, x1, y1, stops) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  for (const [p, col] of stops) g.addColorStop(p, col);
  return g;
}
function shadeCol(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${clamp((n >> 16) + amt, 0, 255)},${clamp(((n >> 8) & 255) + amt, 0, 255)},${clamp((n & 255) + amt, 0, 255)})`;
}
/* 手繪腿：上粗下細的圓頭筆觸柱，底部可前後擺 */
function paintLeg(c, x, yTop, w, len, swing, col) {
  c.fillStyle = col;
  c.beginPath();
  c.moveTo(x - w * 0.62, yTop);
  c.quadraticCurveTo(x - w * 0.7, yTop + len * 0.6, x - w * 0.42 + swing, yTop + len);
  c.lineTo(x + w * 0.42 + swing, yTop + len);
  c.quadraticCurveTo(x + w * 0.7, yTop + len * 0.6, x + w * 0.62, yTop);
  c.closePath(); c.fill();
  c.strokeStyle = INK; c.lineWidth = 4; c.stroke();
}
function paintEye(c, x, y, r = 5) {
  c.fillStyle = "#fffdf8";
  c.beginPath(); c.arc(x, y, r + 2, 0, 7); c.fill();
  c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
  c.fillStyle = "#2b2620";
  c.beginPath(); c.arc(x + 1, y, r * 0.55, 0, 7); c.fill();
  c.fillStyle = "#fff";
  c.beginPath(); c.arc(x + 2.4, y - 2, r * 0.2, 0, 7); c.fill();
}

/* ---- 三角龍 ---- */
function paintTrike(c, pose, pal) {
  const sw = pose === 1 ? 14 : pose === 2 ? -14 : 0;
  const by = pose ? -4 : 0;
  const swings = [sw, -sw, -sw, sw];
  // 尾巴
  const tail = new Path2D();
  tail.moveTo(120, 262 + by);
  tail.quadraticCurveTo(60, 268 + by, 42, 300 + by);
  tail.quadraticCurveTo(95, 310 + by, 130, 306 + by);
  tail.closePath();
  c.fillStyle = grad(c, 60, 250, 140, 310, [[0, pal.dark], [1, pal.body]]);
  c.fill(tail); c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
  // 腿
  [[170, 300], [215, 302], [285, 302], [332, 300]].forEach(([lx, lt], i) =>
    paintLeg(c, lx, lt + by, 15, 400 - lt - by, swings[i], shadeCol(pal.body, -12)));
  // 身體
  const body = new Path2D();
  body.ellipse(240, 268 + by, 132, 66, -0.05, 0, 7);
  c.fillStyle = grad(c, 240, 200 + by, 240, 336 + by, [[0, shadeCol(pal.body, 24)], [0.55, pal.body], [1, shadeCol(pal.body, -14)]]);
  c.fill(body);
  brushTexture(c, body, [110, 205, 260, 135], shadeCol(pal.body, -45), shadeCol(pal.body, 40));
  c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(body);
  // 腹部淡色
  const belly = new Path2D();
  belly.ellipse(252, 300 + by, 96, 34, 0, 0, 7);
  c.fillStyle = pal.belly; c.globalAlpha = 0.85; c.fill(belly); c.globalAlpha = 1;
  // 頸盾
  const frill = new Path2D();
  frill.ellipse(352, 218 + by, 66, 74, 0.25, 0, 7);
  c.fillStyle = grad(c, 320, 150, 380, 290, [[0, shadeCol(pal.body, 30)], [1, pal.dark]]);
  c.fill(frill); c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(frill);
  c.save(); c.clip(frill); c.strokeStyle = shadeCol(pal.body, -35); c.globalAlpha = 0.4; c.lineWidth = 2.5;
  for (let i = 0; i < 7; i++) {
    c.beginPath();
    c.moveTo(352, 218 + by);
    c.lineTo(352 + Math.cos(-0.5 + i * 0.36) * 80, 218 + by + Math.sin(-0.5 + i * 0.36) * 80);
    c.stroke();
  }
  c.restore(); c.globalAlpha = 1;
  // 頭
  const head = new Path2D();
  head.ellipse(392, 252 + by, 46, 34, 0.15, 0, 7);
  c.fillStyle = grad(c, 360, 220, 420, 290, [[0, shadeCol(pal.body, 18)], [1, shadeCol(pal.body, -8)]]);
  c.fill(head); c.strokeStyle = INK; c.lineWidth = 5; c.stroke(head);
  // 角
  c.fillStyle = "#efe8d5";
  const horn = (x0, y0, x1, y1, x2, y2) => {
    c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2 + 6, (y0 + y1) / 2, x1, y1);
    c.lineTo(x2, y2); c.closePath(); c.fill(); c.stroke();
  };
  c.lineWidth = 3.5;
  horn(386, 226 + by, 418, 168 + by, 402, 232 + by);
  horn(414, 232 + by, 452, 182 + by, 428, 238 + by);
  horn(430, 262 + by, 462, 254 + by, 434, 272 + by);
  paintEye(c, 398, 244 + by, 5.5);
}
/* ---- 劍龍 ---- */
function paintStego(c, pose, pal) {
  const sw = pose === 1 ? 13 : pose === 2 ? -13 : 0;
  const by = pose ? -4 : 0;
  const swings = [sw, -sw, -sw, sw];
  const tail = new Path2D();
  tail.moveTo(140, 288 + by);
  tail.quadraticCurveTo(80, 292 + by, 46, 316 + by);
  tail.quadraticCurveTo(90, 322 + by, 146, 316 + by);
  tail.closePath();
  c.fillStyle = grad(c, 50, 285, 150, 325, [[0, pal.dark], [1, pal.body]]);
  c.fill(tail); c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
  [[175, 308], [220, 310], [290, 310], [336, 308]].forEach(([lx, lt], i) =>
    paintLeg(c, lx, lt + by, 15, 400 - lt - by, swings[i], shadeCol(pal.body, -12)));
  const body = new Path2D();
  body.ellipse(255, 280 + by, 138, 60, -0.04, 0, 7);
  c.fillStyle = grad(c, 255, 215 + by, 255, 342 + by, [[0, shadeCol(pal.body, 26)], [0.55, pal.body], [1, shadeCol(pal.body, -12)]]);
  c.fill(body);
  brushTexture(c, body, [120, 220, 270, 125], shadeCol(pal.body, -50), shadeCol(pal.body, 45));
  c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(body);
  const belly = new Path2D();
  belly.ellipse(260, 306 + by, 100, 28, 0, 0, 7);
  c.fillStyle = pal.belly; c.globalAlpha = 0.85; c.fill(belly); c.globalAlpha = 1;
  // 頭
  const head = new Path2D();
  head.ellipse(398, 302 + by, 34, 24, 0.12, 0, 7);
  c.fillStyle = shadeCol(pal.body, 6);
  c.fill(head); c.strokeStyle = INK; c.lineWidth = 4.5; c.stroke(head);
  paintEye(c, 404, 294 + by, 4.5);
  // 背板
  const plates = [[150, 42], [196, 62], [244, 72], [292, 62], [334, 42]];
  plates.forEach(([px, ph], i) => {
    const p = new Path2D();
    p.moveTo(px - 24, 240 + by);
    p.quadraticCurveTo(px - 6, 240 + by - ph * 1.6, px, 238 + by - ph * 1.75);
    p.quadraticCurveTo(px + 8, 240 + by - ph * 1.55, px + 24, 240 + by);
    p.closePath();
    c.fillStyle = grad(c, px, 160 + by, px, 245 + by, [[0, shadeCol(pal.dark, 26)], [1, pal.dark]]);
    c.fill(p); c.strokeStyle = INK; c.lineWidth = 4; c.stroke(p);
  });
  // 尾刺
  c.fillStyle = "#efe8d5"; c.lineWidth = 3.5;
  const spike = (x0, y0, x1, y1, x2, y2) => {
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.lineTo(x2, y2); c.closePath(); c.fill(); c.stroke();
  };
  spike(60, 300 + by, 34, 262 + by, 74, 292 + by);
  spike(58, 306 + by, 26, 292 + by, 70, 300 + by);
}

/* ---- 腕龍 ---- */
function paintBrachio(c, pose, pal) {
  const sw = pose === 1 ? 12 : pose === 2 ? -12 : 0;
  const by = pose ? -4 : 0;
  const swings = [sw, -sw, -sw, sw];
  // 尾巴
  const tail = new Path2D();
  tail.moveTo(150, 285 + by);
  tail.quadraticCurveTo(95, 292 + by, 68, 318 + by);
  tail.quadraticCurveTo(110, 322 + by, 158, 312 + by);
  tail.closePath();
  c.fillStyle = grad(c, 70, 285, 160, 320, [[0, pal.dark], [1, pal.body]]);
  c.fill(tail); c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
  // 腿（長）
  [[180, 300], [228, 302], [300, 302], [348, 300]].forEach(([lx, lt], i) =>
    paintLeg(c, lx, lt + by, 18, 400 - lt - by, swings[i], shadeCol(pal.body, -12)));
  // 身體
  const body = new Path2D();
  body.ellipse(265, 262 + by, 118, 68, -0.06, 0, 7);
  c.fillStyle = grad(c, 265, 195 + by, 265, 332 + by, [[0, shadeCol(pal.body, 26)], [0.55, pal.body], [1, shadeCol(pal.body, -12)]]);
  c.fill(body);
  brushTexture(c, body, [150, 195, 230, 140], shadeCol(pal.body, -40), shadeCol(pal.body, 42));
  c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(body);
  const belly = new Path2D();
  belly.ellipse(268, 294 + by, 86, 32, 0, 0, 7);
  c.fillStyle = pal.belly; c.globalAlpha = 0.85; c.fill(belly); c.globalAlpha = 1;
  // 背部斑點
  c.save(); c.clip(body);
  c.fillStyle = shadeCol(pal.body, 34); c.globalAlpha = 0.7;
  [[215, 218, 17], [258, 206, 21], [302, 216, 15], [238, 240, 12]].forEach(([x, y, r]) => {
    c.beginPath(); c.arc(x, y + by, r, 0, 7); c.fill();
  });
  c.restore(); c.globalAlpha = 1;
  // 長脖子
  const neck = new Path2D();
  neck.moveTo(330, 240 + by);
  neck.quadraticCurveTo(400, 190 + by, 408, 96 + by);
  neck.lineTo(440, 104 + by);
  neck.quadraticCurveTo(442, 200 + by, 372, 268 + by);
  neck.closePath();
  c.fillStyle = grad(c, 340, 100, 360, 270 + by, [[0, shadeCol(pal.body, 22)], [1, shadeCol(pal.body, -6)]]);
  c.fill(neck); c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(neck);
  brushTexture(c, neck, [330, 90, 115, 185], shadeCol(pal.body, -36), shadeCol(pal.body, 34), 40);
  // 喉部淡色
  c.strokeStyle = pal.belly; c.globalAlpha = 0.7; c.lineWidth = 9; c.lineCap = "round";
  c.beginPath();
  c.moveTo(352, 250 + by);
  c.quadraticCurveTo(408, 196 + by, 416, 112 + by);
  c.stroke(); c.globalAlpha = 1;
  // 頭
  const head = new Path2D();
  head.ellipse(432, 96 + by, 30, 19, -0.15, 0, 7);
  c.fillStyle = shadeCol(pal.body, 12);
  c.fill(head); c.strokeStyle = INK; c.lineWidth = 4.5; c.stroke(head);
  paintEye(c, 438, 90 + by, 4.5);
  // 鼻孔
  c.fillStyle = INK;
  c.beginPath(); c.arc(454, 92 + by, 2.4, 0, 7); c.fill();
}
/* ---- 暴龍 ---- */
function paintTrex(c, pose, pal) {
  const sw = pose === 1 ? 18 : pose === 2 ? -18 : 0;
  const by = pose ? -5 : 0;
  // 尾巴（長，平衡擺）
  const tail = new Path2D();
  tail.moveTo(180, 235 + by);
  tail.quadraticCurveTo(100, 225 + by + sw * 0.3, 38, 262 + by + sw * 0.5);
  tail.quadraticCurveTo(100, 282 + by, 188, 275 + by);
  tail.closePath();
  c.fillStyle = grad(c, 40, 230, 190, 285 + by, [[0, pal.dark], [1, pal.body]]);
  c.fill(tail); c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
  // 腿（兩足，有力）
  paintLeg(c, 226, 290 + by, 20, 110 - by, sw, shadeCol(pal.body, -14));
  paintLeg(c, 292, 292 + by, 20, 108 - by, -sw, shadeCol(pal.body, -14));
  // 身體
  const body = new Path2D();
  body.ellipse(262, 232 + by, 92, 74, -0.28, 0, 7);
  c.fillStyle = grad(c, 262, 160 + by, 262, 305 + by, [[0, shadeCol(pal.body, 26)], [0.55, pal.body], [1, shadeCol(pal.body, -12)]]);
  c.fill(body);
  brushTexture(c, body, [175, 160, 180, 145], shadeCol(pal.body, -45), shadeCol(pal.body, 40));
  c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(body);
  const belly = new Path2D();
  belly.ellipse(250, 268 + by, 58, 40, -0.15, 0, 7);
  c.fillStyle = pal.belly; c.globalAlpha = 0.85; c.fill(belly); c.globalAlpha = 1;
  // 背部條紋
  c.save(); c.clip(body);
  c.strokeStyle = shadeCol(pal.body, -38); c.globalAlpha = 0.55; c.lineWidth = 7; c.lineCap = "round";
  for (let i = 0; i < 4; i++) {
    c.beginPath();
    c.moveTo(210 + i * 30, 172 + by + i * 3);
    c.lineTo(222 + i * 30, 196 + by + i * 3);
    c.stroke();
  }
  c.restore(); c.globalAlpha = 1;
  // 頭（大）
  const head = new Path2D();
  head.ellipse(352, 168 + by, 62, 50, -0.1, 0, 7);
  c.fillStyle = grad(c, 300, 120 + by, 400, 220 + by, [[0, shadeCol(pal.body, 24)], [1, shadeCol(pal.body, -6)]]);
  c.fill(head); c.strokeStyle = INK; c.lineWidth = 5.5; c.stroke(head);
  // 下顎
  const jaw = new Path2D();
  jaw.ellipse(362, 206 + by, 46, 20, 0.12, 0, 7);
  c.fillStyle = shadeCol(pal.body, -22);
  c.fill(jaw); c.strokeStyle = INK; c.lineWidth = 4; c.stroke(jaw);
  // 牙齒
  c.fillStyle = "#fffdf8"; c.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const tx = 336 + i * 18;
    c.beginPath();
    c.moveTo(tx, 208 + by); c.lineTo(tx + 5, 222 + by); c.lineTo(tx + 10, 208 + by);
    c.closePath(); c.fill(); c.stroke();
  }
  // 小手
  paintLeg(c, 300, 262 + by, 8, 26, sw * 0.4, shadeCol(pal.body, -10));
  paintLeg(c, 316, 258 + by, 8, 24, -sw * 0.4, shadeCol(pal.body, -10));
  // 眉毛 + 眼睛
  c.strokeStyle = INK; c.lineWidth = 5; c.lineCap = "round";
  c.beginPath(); c.moveTo(330, 138 + by); c.lineTo(356, 132 + by); c.stroke();
  paintEye(c, 346, 152 + by, 6);
}

const PAINTERS = { trike: paintTrike, stego: paintStego, brachio: paintBrachio, trex: paintTrex };
const frameCache = {};
function paintFrame(sp, gold, pose) {
  const key = sp + (gold ? "_g" : "") + "_" + pose;
  if (frameCache[key]) return frameCache[key];
  const c = makeCanvas(480, 440);
  const x = c.getContext("2d");
  const pal = gold ? { ...PAINT[sp], ...GOLD_PAINT } : PAINT[sp];
  // 柔和地面陰影
  x.fillStyle = "rgba(43,38,32,.16)";
  x.beginPath(); x.ellipse(240, 402, 170, 20, 0, 0, 7); x.fill();
  PAINTERS[sp](x, pose, pal);
  frameCache[key] = c;
  return c;
}
function frameTex(sp, gold, pose) {
  const t = new THREE.CanvasTexture(paintFrame(sp, gold, pose));
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================= 玩家（小農夫） ================= */
function makePlayer() {
  const g = new THREE.Group();
  const legs = [];
  for (const s of [-1, 1]) {
    const leg = new THREE.Group();
    leg.add(box(0.3, 0.75, 0.3, 0x5a4a38, 0, 0.38, 0));
    leg.position.set(0, 0, s * 0.2);
    legs.push(leg); g.add(leg);
  }
  g.add(box(0.85, 1.0, 0.65, 0x4a7c59, 0, 1.35, 0));
  for (const s of [-1, 1]) g.add(box(0.22, 0.7, 0.22, 0x4a7c59, 0, 1.5, s * 0.48));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 8), M(0xf0c8a0));
  head.position.y = 2.15; g.add(head);
  const brim = cyl(0.62, 0.62, 0.08, 0xc9a227, 0, 2.42, 0, 12);
  const top = cyl(0.34, 0.4, 0.3, 0xc9a227, 0, 2.6, 0, 10);
  g.add(brim, top);
  g.add(shadowBlob(0.9));
  return { group: g, legs };
}

/* ================= 遊戲數值 ================= */
const SPECIES = {
  trike:  { name: "三角龍", price: 40,  earn: 6,  desc: "溫馴好養，回本最快的入門款。" },
  stego:  { name: "劍龍",   price: 70,  earn: 9,  desc: "背上有骨板，走路慢吞吞的很療癒。" },
  brachio:{ name: "腕龍",   price: 110, earn: 14, desc: "長脖子大個子，產金幣的高手。" },
  trex:   { name: "暴龍",   price: 180, earn: 22, desc: "脾氣不好但超會生錢，牧場王牌。" },
};
const STAGE_NAME = ["幼體", "青少年", "成年"];
const STAGE_SCALE = [0.5, 0.75, 1.0];
const GROW_NEED = [3, 5];
const SAVE_KEY = "dino3d-v1";

/* ================= 遊戲狀態 ================= */
let state = load() || { coins: 120, dinos: [], nextId: 1 };
function save() {
  state.px = player.group.position.x; state.pz = player.group.position.z;
  state.dinos = dinos.map(o => ({ sp: o.sp, stage: o.stage, feed: o.feed, gold: o.gold, x: o.x, z: o.z }));
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function resetGame() {
  if (!confirm("確定要重新開始？現有的恐龍和金幣都會消失。")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

const player = makePlayer();
player.group.position.set(state.px ?? 0, 0, state.pz ?? 8);
scene.add(player.group);
const P = { speed: 6, phase: 0, moving: false };

let dinos = [];   // {sp,stage,feed,gold,x,z,tx,tz,wait,phase,payT,sprite,blob,frames,tag,frameT,dir}
let drops = [];

function makeTag() {
  const cv2 = document.createElement("canvas");
  cv2.width = 256; cv2.height = 64;
  const tex = new THREE.CanvasTexture(cv2);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(3.6, 0.9, 1);
  sp.userData.cv = cv2;
  return sp;
}
function drawTag(tag, d) {
  const c = tag.userData.cv.getContext("2d");
  c.clearRect(0, 0, 256, 64);
  const sp = SPECIES[d.sp];
  const label = `${d.gold ? "✨金" : ""}${sp.name}·${STAGE_NAME[d.stage]}` +
    (d.stage < 2 ? ` (${d.feed}/${GROW_NEED[d.stage]})` : "");
  c.font = "26px 'PingFang TC','Microsoft JhengHei',sans-serif";
  const tw = c.measureText(label).width + 36;
  c.fillStyle = "rgba(255,253,248,.9)";
  c.beginPath();
  if (c.roundRect) c.roundRect((256 - tw) / 2, 10, tw, 44, 22); else c.rect((256 - tw) / 2, 10, tw, 44);
  c.fill();
  c.fillStyle = d.stage >= 2 ? "#8a6a12" : "#2b2620";
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(label, 128, 33);
  tag.material.map.needsUpdate = true;
}

function spawnDino(sp, opts = {}) {
  const gold = opts.gold ?? (Math.random() < 0.08);
  const meta = PAINT[sp];
  const frames = [0, 1, 2].map(p => frameTex(sp, gold, p));
  const mat = new THREE.SpriteMaterial({ map: frames[0], transparent: true, alphaTest: 0.04 });
  const sprite = new THREE.Sprite(mat);
  const blob = shadowBlob(1.9);
  const d = {
    id: state.nextId++, sp, stage: opts.stage ?? 0, feed: opts.feed ?? 0, gold,
    x: opts.x ?? rand(PEN.x + 8, PEN.x + PEN.w - 8),
    z: opts.z ?? rand(PEN.z + 8, PEN.z + PEN.h - 8),
    tx: 0, tz: 0, wait: rand(0, 2), phase: rand(0, 6), payT: rand(6, 10),
    sprite, blob, frames, frameT: 0, frame: 0, dir: 1, tag: makeTag(),
  };
  const h = meta.h * STAGE_SCALE[d.stage];
  sprite.scale.set(h * meta.aspect, h, 1);
  blob.scale.setScalar(STAGE_SCALE[d.stage]);
  sprite.position.set(d.x, h / 2, d.z);
  blob.position.set(d.x, 0.02, d.z);
  scene.add(sprite, blob);
  drawTag(d.tag, d);
  d.tag.position.set(d.x, h + 0.7, d.z);
  scene.add(d.tag);
  dinos.push(d);
  retarget(d);
  return d;
}
function removeDino(d) { scene.remove(d.sprite, d.blob, d.tag); dinos = dinos.filter(x => x !== d); }
function retarget(d) {
  d.tx = rand(PEN.x + 5, PEN.x + PEN.w - 5);
  d.tz = rand(PEN.z + 5, PEN.z + PEN.h - 5);
  d.wait = rand(0.5, 3.5);
}
function dinoHeight(d) { return PAINT[d.sp].h * STAGE_SCALE[d.stage]; }

const coinGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.14, 16);
const coinMat = new THREE.MeshLambertMaterial({ color: 0xd8b93a, emissive: 0x6a5510 });
function dropCoin(x, z, val) {
  const m = new THREE.Mesh(coinGeo, coinMat);
  m.rotation.x = Math.PI / 2;
  m.position.set(x, 0.6, z);
  scene.add(m);
  drops.push({ mesh: m, val, t: rand(0, 6) });
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, 1800);
}

for (const s of state.dinos) spawnDino(s.sp, s);

function refreshHud() {
  document.getElementById("coinTxt").textContent = state.coins;
  document.getElementById("dinoTxt").textContent = dinos.length;
}

/* ================= 互動 ================= */
function inShopMat() {
  const p = player.group.position;
  return p.x > MAT.x - 2 && p.x < MAT.x + MAT.w + 2 && p.z > MAT.z - 2 && p.z < MAT.z + MAT.h + 4;
}
function nearDino() {
  const p = player.group.position;
  let best = null, bd = 3.4;
  for (const d of dinos) {
    if (d.stage >= 2) continue;
    const dd = Math.hypot(d.x - p.x, d.z - p.z);
    if (dd < bd) { bd = dd; best = d; }
  }
  return best;
}
function feedDino() {
  const d = nearDino();
  if (!d) { toast("附近沒有可以餵食的恐龍"); return; }
  if (state.coins < 10) { toast("金幣不夠（餵食需 $10）"); return; }
  state.coins -= 10;
  d.feed++;
  const need = GROW_NEED[d.stage];
  if (d.feed >= need) {
    d.feed = 0; d.stage++;
    const h = dinoHeight(d);
    d.sprite.scale.set(h * PAINT[d.sp].aspect, h, 1);
    d.blob.scale.setScalar(STAGE_SCALE[d.stage]);
    toast(`🎉 ${SPECIES[d.sp].name}長大成「${STAGE_NAME[d.stage]}」了！`);
  } else {
    toast(`${SPECIES[d.sp].name} 吃飽了（${d.feed}/${need}）`);
  }
  drawTag(d.tag, d);
  save(); refreshHud();
}

/* 商店 */
let shopOpen = false;
function renderShop() {
  const g = document.getElementById("itemGrid");
  g.innerHTML = "";
  for (const [k, sp] of Object.entries(SPECIES)) {
    const card = document.createElement("div");
    card.className = "it";
    const th = document.createElement("div"); th.className = "thumb";
    th.appendChild(paintFrame(k, false, 0));
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = sp.name;
    const mt = document.createElement("div"); mt.className = "mt";
    mt.textContent = sp.desc + ` 成年每 8 秒約產 $${sp.earn}。`;
    const btn = document.createElement("button");
    btn.textContent = `購買 $${sp.price}`;
    btn.disabled = state.coins < sp.price;
    btn.onclick = () => {
      if (state.coins < sp.price) return;
      state.coins -= sp.price;
      spawnDino(k);
      toast(`買到了${sp.name}寶寶！`);
      save(); renderShop(); refreshHud();
    };
    card.append(th, nm, mt, btn);
    g.appendChild(card);
  }
}
function openShop() { shopOpen = true; renderShop(); document.getElementById("shop").classList.add("open"); }
function closeShop() { shopOpen = false; document.getElementById("shop").classList.remove("open"); save(); }

/* ================= 輸入 ================= */
const keys = {};
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (k === "e" && inShopMat() && !shopOpen) openShop();
  if (k === "f" && !shopOpen) feedDino();
  if (k === "escape") closeShop();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const joy = { active: false, id: null, ox: 0, oy: 0, vx: 0, vy: 0 };
const look = { active: false, id: null, lx: 0, ly: 0 };
const joyBase = document.getElementById("joyBase");
const joyKnob = document.getElementById("joyKnob");
const actBtn = document.getElementById("actBtn");
let camYaw = 0.6, camPitch = 0.55, camDist = 16;

wrapEl.addEventListener("touchstart", e => {
  if (shopOpen) return;
  for (const t of e.changedTouches) {
    if (t.clientX < window.innerWidth * 0.55 && !joy.active) {
      joy.active = true; joy.id = t.identifier;
      joy.ox = t.clientX; joy.oy = t.clientY; joy.vx = 0; joy.vy = 0;
      const r = wrapEl.getBoundingClientRect();
      joyBase.style.left = (t.clientX - r.left - 59) + "px";
      joyBase.style.top = (t.clientY - r.top - 59) + "px";
      joyBase.style.bottom = "auto";
      joyBase.style.display = "block";
    } else if (!look.active) {
      look.active = true; look.id = t.identifier;
      look.lx = t.clientX; look.ly = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });
wrapEl.addEventListener("touchmove", e => {
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
      const L = Math.hypot(dx, dy), max = 46;
      if (L > max) { dx = dx / L * max; dy = dy / L * max; }
      joy.vx = dx / max; joy.vy = dy / max;
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else if (look.active && t.identifier === look.id) {
      camYaw -= (t.clientX - look.lx) * 0.008;
      camPitch = clamp(camPitch + (t.clientY - look.ly) * 0.005, 0.15, 1.15);
      look.lx = t.clientX; look.ly = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      joy.active = false; joy.vx = 0; joy.vy = 0;
      joyBase.style.display = "none";
      joyKnob.style.transform = "translate(-50%,-50%)";
    }
    if (look.active && t.identifier === look.id) look.active = false;
  }
}
wrapEl.addEventListener("touchend", touchEnd);
wrapEl.addEventListener("touchcancel", touchEnd);
actBtn.addEventListener("touchstart", e => {
  e.preventDefault(); e.stopPropagation();
  if (actBtn.dataset.mode === "shop") openShop();
  else if (actBtn.dataset.mode === "feed") feedDino();
}, { passive: false });
actBtn.addEventListener("click", () => {
  if (actBtn.dataset.mode === "shop") openShop();
  else if (actBtn.dataset.mode === "feed") feedDino();
});

let mouseLook = false;
wrapEl.addEventListener("mousedown", e => { if (!shopOpen) mouseLook = true; });
addEventListener("mouseup", () => mouseLook = false);
addEventListener("mousemove", e => {
  if (!mouseLook || shopOpen) return;
  camYaw -= e.movementX * 0.006;
  camPitch = clamp(camPitch + e.movementY * 0.004, 0.15, 1.15);
});
wrapEl.addEventListener("wheel", e => {
  camDist = clamp(camDist + e.deltaY * 0.01, 7, 30);
  e.preventDefault();
}, { passive: false });

document.getElementById("shop").addEventListener("click", e => { if (e.target.id === "shop") closeShop(); });

/* ================= 更新 ================= */
function animateLegs(legs, phase, amp) {
  legs.forEach((leg, i) => {
    const off = (i % 2 === 0 ? 0 : Math.PI) + (i > 1 ? Math.PI * 0.5 : 0);
    leg.rotation.x = Math.sin(phase + off) * amp;
  });
}
function updatePlayer(dt) {
  let ix = 0, iy = 0;
  if (keys["arrowup"] || keys["w"]) iy -= 1;
  if (keys["arrowdown"] || keys["s"]) iy += 1;
  if (keys["arrowleft"] || keys["a"]) ix -= 1;
  if (keys["arrowright"] || keys["d"]) ix += 1;
  if (joy.active) { ix = joy.vx; iy = joy.vy; }
  P.moving = !!(ix || iy);
  if (!P.moving) { animateLegs(player.legs, 0, 0); return; }
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  const rx = -fz, rz = fx;
  let mx = fx * (-iy) + rx * ix, mz = fz * (-iy) + rz * ix;
  const L = Math.hypot(mx, mz) || 1;
  mx /= L; mz /= L;
  const p = player.group.position;
  let nx = p.x + mx * P.speed * dt, nz = p.z + mz * P.speed * dt;
  const dl = Math.hypot(nx, nz);
  if (dl > WORLD_R) { nx = nx / dl * WORLD_R; nz = nz / dl * WORLD_R; }
  const bsx = nx - SHOP_POS.x, bsz = nz - SHOP_POS.z;
  if (!(Math.abs(bsx) < 9.5 && Math.abs(bsz) < 7)) { p.x = nx; p.z = nz; }
  P.phase += dt * 10;
  player.group.rotation.y = Math.atan2(-mz, mx);
  animateLegs(player.legs, P.phase, 0.55);
}
function updateDinos(dt) {
  for (const d of dinos) {
    const sp = SPECIES[d.sp];
    let moving = false;
    if (d.wait > 0) d.wait -= dt;
    else {
      const dx = d.tx - d.x, dz = d.tz - d.z, L = Math.hypot(dx, dz);
      if (L < 0.6) retarget(d);
      else {
        const v = (1.6 + d.stage * 0.5) * dt;
        d.x += dx / L * v; d.z += dz / L * v;
        d.phase += dt * (5 + d.stage * 1.5);
        moving = true;
        d.dir = dx >= 0 ? 1 : -1;
      }
    }
    // 走路影格：邁步時在 pose1/pose2 間切換
    const h = dinoHeight(d);
    if (moving) {
      d.frameT += dt;
      if (d.frameT > 0.13) {
        d.frameT = 0;
        d.frame = d.frame === 1 ? 2 : 1;
        d.sprite.material.map = d.frames[d.frame];
      }
    } else if (d.frame !== 0) {
      d.frame = 0;
      d.sprite.material.map = d.frames[0];
    }
    const bob = moving ? Math.abs(Math.sin(d.phase * 1.4)) * 0.12 : 0;
    const meta = PAINT[d.sp];
    d.sprite.scale.set(h * meta.aspect * d.dir, h, 1);
    d.sprite.position.set(d.x, h / 2 + bob, d.z);
    d.blob.position.set(d.x, 0.02, d.z);
    d.tag.position.set(d.x, h + 0.8 + bob, d.z);
    if (d.stage >= 2) {
      d.payT -= dt;
      if (d.payT <= 0) {
        d.payT = rand(7, 11);
        dropCoin(d.x + rand(-1.5, 1.5), d.z + rand(-1.5, 1.5),
          Math.round(sp.earn * (d.gold ? 3 : 1) * rand(0.8, 1.3)));
      }
    }
  }
  const p = player.group.position;
  for (let i = drops.length - 1; i >= 0; i--) {
    const c = drops[i];
    c.t += dt;
    c.mesh.rotation.z += dt * 3;
    c.mesh.position.y = 0.6 + Math.sin(c.t * 4) * 0.15;
    if (Math.hypot(c.mesh.position.x - p.x, c.mesh.position.z - p.z) < 2.2) {
      state.coins += c.val;
      toast(`+${c.val} 金幣`);
      scene.remove(c.mesh);
      drops.splice(i, 1);
    }
  }
}
function updateCamera() {
  const p = player.group.position;
  const cx = p.x + Math.sin(camYaw) * camDist * Math.cos(camPitch);
  const cz = p.z + Math.cos(camYaw) * camDist * Math.cos(camPitch);
  const cy = p.y + camDist * Math.sin(camPitch) + 1.5;
  camera.position.set(cx, cy, cz);
  camera.lookAt(p.x, p.y + 2, p.z);
}

/* ================= 主循環 ================= */
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (!shopOpen) { updatePlayer(dt); updateDinos(dt); }
  updateCamera();
  renderer.render(scene, camera);

  const hint = document.getElementById("hint");
  if (inShopMat() && !shopOpen) {
    hint.textContent = "點右下按鈕開店"; hint.style.opacity = 1;
    actBtn.style.display = "flex"; actBtn.className = ""; actBtn.textContent = "🛒 商店";
    actBtn.dataset.mode = "shop";
  } else if (nearDino() && !shopOpen) {
    hint.textContent = `餵食 ${SPECIES[nearDino().sp].name}（$10）`; hint.style.opacity = 1;
    actBtn.style.display = "flex"; actBtn.className = "feed"; actBtn.textContent = "🍖 餵食";
    actBtn.dataset.mode = "feed";
  } else {
    hint.style.opacity = 0; actBtn.style.display = "none"; actBtn.dataset.mode = "";
  }

  acc += dt;
  if (acc > 5) { acc = 0; save(); refreshHud(); }
  requestAnimationFrame(loop);
}

/* ================= 啟動 ================= */
function resize() {
  const cssW = wrapEl.clientWidth;
  const cssH = Math.round(clamp(cssW * 0.62, 300, window.innerHeight - 150));
  cv.style.width = cssW + "px";
  cv.style.height = cssH + "px";
  renderer.setSize(cssW, cssH, false);
  camera.aspect = cssW / cssH;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
document.getElementById("loadtip").style.display = "none";
refreshHud();
if (dinos.length === 0) setTimeout(() => toast("歡迎來到 3D 牧場！往右上的商店走，買第一隻恐龍吧"), 600);
requestAnimationFrame(loop);
</script>
